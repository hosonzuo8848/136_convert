name: PDF→WebP（公开仓 published release 匿名直链，零 token 零123凭据）

# 链路（10-29 方案B，GitHub 直连 123 被 IP 封制作废）：
#   本机直连下载 136 PDF → 传【公开仓 published release】→ 匿名直链
#   → 本 workflow 匿名 GET 该直链下载（公开仓 asset 无需任何 token，绕开 token 遮断死结）
#   → 转 webp → 存 artifact → 本机回收（**终点传139 另议**）；release 由本机回收后删，不留存
on:
  workflow_dispatch:
    inputs:
      pdf_fid:
        description: '136 PDF 文件ID（artifact 命名/日志用）'
        required: true
      pdf_url:
        description: '公开仓 published release 的匿名 asset 直链'
        required: true

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip
          pip3 install pymupdf pillow requests --quiet

      - name: 匿名下载 PDF（公开直链，零 token）
        env:
          PDF_URL: ${{ inputs.pdf_url }}
        run: |
          python3 <<'PY'
          import os, sys, requests
          u = os.environ['PDF_URL']
          r = requests.get(u, stream=True, timeout=600, allow_redirects=True)
          n = 0
          with open('input.pdf', 'wb') as f:
              for c in r.iter_content(1 << 20):
                  f.write(c); n += len(c)
          head = open('input.pdf', 'rb').read(4)
          print('下载 HTTP=%d 字节=%d 首4字节魔数=%r' % (r.status_code, n, head))
          if r.status_code != 200 or head != b'%PDF':
              sys.exit('下载失败或非PDF内容')
          PY

      - name: 转换 PDF→WebP
        run: |
          python3 -c "
          import fitz, io, os
          from PIL import Image
          doc=fitz.open('input.pdf'); n=doc.page_count
          print('PDF 共', n, '页')
          os.makedirs('webp_out', exist_ok=True)
          for i in range(n):
              pix=doc[i].get_pixmap(dpi=120)
              img=Image.frombytes('RGB',(pix.width,pix.height),pix.samples)
              if pix.width>16383 or pix.height>16383:
                  r=16383/max(pix.width,pix.height); img=img.resize((int(pix.width*r),int(pix.height*r)),Image.LANCZOS)
              buf=io.BytesIO(); img.save(buf,'webp',quality=80,method=0)
              open('webp_out/page_%04d.webp'%(i+1),'wb').write(buf.getvalue())
          doc.close()
          print('转换完成', n, '页')
          "

      - name: 存为 artifact（交本机回收）
        uses: actions/upload-artifact@v4
        with:
          name: pdf-${{ inputs.pdf_fid }}
          path: webp_out/
          retention-days: 7

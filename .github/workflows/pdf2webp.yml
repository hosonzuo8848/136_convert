name: PDF→WebP 批量转换(云端,本地零CPU)

on:
  workflow_dispatch:
    inputs:
      pdf_fid:
        description: '136 PDF 文件ID'
        required: true
      parent_fid:
        description: '139 目标册目录ID'
        required: true
      vol_name:
        description: '册目录名(如 別060-0011-02)'
        required: true

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip
          pip3 install pymupdf pillow requests --quiet

      - name: 下载 PDF
        run: |
          python3 -c "
          import requests, sys
          # 136 token(从 GitHub Secrets)
          PAN='https://open-api.123pan.com'
          # 从 Secrets 获取凭据
          client_id='${{ secrets.PAN136_CLIENT_ID }}'
          client_secret='${{ secrets.PAN136_CLIENT_SECRET }}'
          # 取 token
          r=requests.post(PAN+'/api/v1/access_token', headers={'Platform':'open_platform'},
              json={'clientID':client_id,'clientSecret':client_secret}, timeout=30)
          tok=r.json().get('data',{}).get('accessToken')
          H={'Platform':'open_platform','Authorization':'Bearer '+tok}
          # 下载 PDF
          fid=${{ inputs.pdf_fid }}
          r=requests.get(PAN+'/api/v1/file/download_info', headers=H, params={'fileId':fid}, timeout=30)
          url=r.json().get('data',{}).get('downloadUrl')
          print(f'下载URL: {url[:60]}...')
          r=requests.get(url, stream=True, timeout=300)
          with open('input.pdf','wb') as f:
            for chunk in r.iter_content(1024*1024):
              if chunk: f.write(chunk)
          import os
          sz=os.path.getsize('input.pdf')
          print(f'下载完成: {sz//1024//1024}MB')
          "

      - name: 转换 PDF→WebP
        run: |
          python3 -c "
          import fitz, io, os, sys
          from PIL import Image
          doc=fitz.open('input.pdf')
          n=doc.page_count
          print(f'PDF 共 {n} 页')
          os.makedirs('webp_out', exist_ok=True)
          for i in range(n):
              pix=doc[i].get_pixmap(dpi=120)
              img=Image.frombytes('RGB',(pix.width,pix.height),pix.samples)
              if pix.width>16383 or pix.height>16383:
                  r=16383/max(pix.width,pix.height)
                  img=img.resize((int(pix.width*r),int(pix.height*r)),Image.LANCZOS)
              buf=io.BytesIO()
              img.save(buf,'webp',quality=80,method=0)
              with open(f'webp_out/page_{i+1:04d}.webp','wb') as f:
                  f.write(buf.getvalue())
              if (i+1)%10==0: print(f'  已转 {i+1}/{n} 页')
          doc.close()
          print(f'转换完成: {n} 页')
          "

      - name: 存为 GitHub artifact(交本地 A盘中转上传,禁止 GitHub 直写 123)
        uses: actions/upload-artifact@v4
        with:
          name: pdf-${{ inputs.pdf_fid }}
          path: webp_out/
          retention-days: 7

      - name: 清理
        if: always()
        run: rm -rf input.pdf webp_out

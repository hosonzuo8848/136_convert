name: PDF→WebP 转换(云端,本地零CPU,零123凭据)

# 链路(依 10-09 封号规矩:云端绝不持 123 凭据、绝不调 123 API):
#   本地用 136 凭据换签名直链 pdf_url → 传给本 workflow
#   → GitHub 仅 GET 该直链下载 PDF → 转 webp → 存 artifact
#   → 本地 gh run download 回收 artifact → A盘中转 → 本机上传 139 → 即删
on:
  workflow_dispatch:
    inputs:
      pdf_fid:
        description: '136 PDF 文件ID(仅用于 artifact 命名与日志)'
        required: true
      pdf_url:
        description: '123 签名直链(本地生成,匿名可取,不含凭据)'
        required: true

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip
          pip3 install pymupdf pillow requests --quiet

      - name: 下载 PDF(仅 GET 签名直链,零 123 凭据/API)
        env:
          PDF_URL: ${{ inputs.pdf_url }}
        run: |
          python3 <<'PY'
          import os, sys, requests, time
          url = os.environ['PDF_URL']
          ok = False
          for k in range(3):
              try:
                  r = requests.get(url, stream=True, timeout=300, allow_redirects=True)
                  if r.status_code == 200:
                      with open('input.pdf', 'wb') as f:
                          for c in r.iter_content(1024 * 1024):
                              if c:
                                  f.write(c)
                      ok = True
                      break
                  print('HTTP', r.status_code, r.text[:120]); time.sleep(5)
              except Exception as e:
                  print('retry', k, repr(e)[:120]); time.sleep(5)
          if not ok:
              sys.exit('下载失败(直链可能已过期)')
          print('下载完成 MB=', os.path.getsize('input.pdf') // 1024 // 1024)
          PY

      - name: 转换 PDF→WebP
        run: |
          python3 -c "
          import fitz, io, os, sys
          from PIL import Image
          doc=fitz.open('input.pdf')
          n=doc.page_count
          print(f'PDF 共 {n} 页')
          os.makedirs('webp_out', exist_ok=True)
          for i in range(n):
              pix=doc[i].get_pixmap(dpi=120)
              img=Image.frombytes('RGB',(pix.width,pix.height),pix.samples)
              if pix.width>16383 or pix.height>16383:
                  r=16383/max(pix.width,pix.height)
                  img=img.resize((int(pix.width*r),int(pix.height*r)),Image.LANCZOS)
              buf=io.BytesIO()
              img.save(buf,'webp',quality=80,method=0)
              with open(f'webp_out/page_{i+1:04d}.webp','wb') as f:
                  f.write(buf.getvalue())
              if (i+1)%10==0: print(f'  已转 {i+1}/{n} 页')
          doc.close()
          print(f'转换完成: {n} 页')
          "

      - name: 存为 GitHub artifact(交本地 A盘中转上传,禁止 GitHub 直写 123)
        uses: actions/upload-artifact@v4
        with:
          name: pdf-${{ inputs.pdf_fid }}
          path: webp_out/
          retention-days: 7

      - name: 清理
        if: always()
        run: rm -rf input.pdf webp_out
